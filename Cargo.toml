[workspace]
resolver = "2"
members = [
    "crates/oxicale-core",
    "crates/oxicale-ical",
    "crates/oxicale-vcard",
    "crates/oxicale-storage",
    "crates/oxicale",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/oxicale"

[workspace.dependencies]
argon2 = "0.5"
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
http = "1"
httpdate = "1"
ipnet = { version = "2", features = ["serde"] }
percent-encoding = "2"
quick-xml = "0.37"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
